[project]
name = "aura-export"
version = "0.1.0"
description = "Export Neo4j Aura database to CSV files for S3 upload"
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.0",
    "python-dotenv>=1.0",
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
