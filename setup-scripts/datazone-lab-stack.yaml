AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Bedrock Agents Lab - DataZone and SageMaker Unified Studio Setup
  Creates DataZone domain, project, IAM roles, and inference profiles for workshop.

Parameters:
  DomainName:
    Type: String
    Default: bedrock-lab-domain
    Description: Name for the DataZone domain

  ProjectName:
    Type: String
    Default: bedrock-lab-project
    Description: Name for the DataZone project

  CreateInferenceProfiles:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether to create Bedrock inference profiles

Conditions:
  ShouldCreateInferenceProfiles: !Equals [!Ref CreateInferenceProfiles, 'true']

Resources:
  #############################################
  # IAM Roles
  #############################################

  # Domain Execution Role - required for DataZone domain
  DataZoneDomainExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'AmazonDataZoneDomainExecutionRole-${AWS::StackName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: datazone.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonDataZoneDomainExecutionRolePolicy
      Tags:
        - Key: Purpose
          Value: BedrockAgentsLab

  # Lab Role - for workshop attendees
  BedrockLabRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: BedrockLabRole
      Description: Role for Bedrock Agents Lab workshop attendees
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - sagemaker.amazonaws.com
                - bedrock.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Purpose
          Value: BedrockAgentsLab

  # Lab Policy - comprehensive permissions for SageMaker Unified Studio V2
  BedrockLabPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: BedrockAgentsLabPolicy
      Description: Permissions for Bedrock Agents Lab - SageMaker Unified Studio V2, inference profiles, model invocation
      Roles:
        - !Ref BedrockLabRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: InferenceProfileManagement
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
              - bedrock:ListInferenceProfiles
              - bedrock:GetInferenceProfile
              - bedrock:CreateInferenceProfile
              - bedrock:DeleteInferenceProfile
              - bedrock:ListTagsForResource
              - bedrock:TagResource
            Resource: '*'
          - Sid: BedrockModelInvocation
            Effect: Allow
            Action:
              - bedrock-runtime:Converse
              - bedrock-runtime:ConverseStream
              - bedrock-runtime:InvokeModel
              - bedrock-runtime:InvokeModelWithResponseStream
            Resource:
              - arn:aws:bedrock:*::foundation-model/anthropic.*
              - arn:aws:bedrock:*:*:inference-profile/*
              - arn:aws:bedrock:*:*:application-inference-profile/*
          - Sid: DataZoneFullAccess
            Effect: Allow
            Action:
              - datazone:*
            Resource: '*'
          - Sid: RAMForProjectProfiles
            Effect: Allow
            Action:
              - ram:GetResourceShareAssociations
              - ram:GetResourceShares
              - ram:ListResources
              - ram:ListResourceSharePermissions
            Resource: '*'
          - Sid: IAMForServiceRoles
            Effect: Allow
            Action:
              - iam:GetRole
              - iam:PassRole
              - iam:ListRoles
              - iam:CreateServiceLinkedRole
            Resource: '*'
          - Sid: S3ForBlueprints
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource: '*'
          - Sid: SageMakerUnifiedStudio
            Effect: Allow
            Action:
              - sagemaker:*
            Resource: '*'

  #############################################
  # DataZone Domain and Project
  #############################################

  DataZoneDomain:
    Type: AWS::DataZone::Domain
    Properties:
      Name: !Ref DomainName
      Description: Bedrock Agents Lab workshop domain for SageMaker Unified Studio
      DomainExecutionRole: !GetAtt DataZoneDomainExecutionRole.Arn
      DomainVersion: V2
      Tags:
        - Key: Purpose
          Value: BedrockAgentsLab
        - Key: Stack
          Value: !Ref AWS::StackName

  DataZoneProject:
    Type: AWS::DataZone::Project
    DependsOn: DataZoneDomain
    Properties:
      Name: !Ref ProjectName
      Description: Bedrock Agents Lab workshop project
      DomainIdentifier: !GetAtt DataZoneDomain.Id

  #############################################
  # Inference Profiles (Custom Resource)
  #############################################

  # Lambda execution role for creating inference profiles
  InferenceProfileLambdaRole:
    Type: AWS::IAM::Role
    Condition: ShouldCreateInferenceProfiles
    Properties:
      RoleName: !Sub 'InferenceProfileLambdaRole-${AWS::StackName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInferenceProfiles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:CreateInferenceProfile
                  - bedrock:DeleteInferenceProfile
                  - bedrock:ListInferenceProfiles
                  - bedrock:GetInferenceProfile
                  - bedrock:TagResource
                Resource: '*'

  # Lambda function to create inference profiles
  InferenceProfileFunction:
    Type: AWS::Lambda::Function
    Condition: ShouldCreateInferenceProfiles
    Properties:
      FunctionName: !Sub 'CreateInferenceProfiles-${AWS::StackName}'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      Role: !GetAtt InferenceProfileLambdaRole.Arn
      Environment:
        Variables:
          DOMAIN_ID: !GetAtt DataZoneDomain.Id
          PROJECT_ID: !GetAtt DataZoneProject.Id
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import os

          def handler(event, context):
              print(f"Event: {event}")

              if event['RequestType'] == 'Delete':
                  # Clean up inference profiles on stack deletion
                  try:
                      delete_profiles()
                  except Exception as e:
                      print(f"Error deleting profiles: {e}")
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return

              if event['RequestType'] in ['Create', 'Update']:
                  try:
                      arns = create_profiles()
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                          'ProfileArns': ','.join(arns)
                      })
                  except Exception as e:
                      print(f"Error: {e}")
                      cfnresponse.send(event, context, cfnresponse.FAILED, {
                          'Error': str(e)
                      })
                  return

              cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

          def create_profiles():
              bedrock = boto3.client('bedrock')
              region = os.environ['AWS_REGION']
              account_id = boto3.client('sts').get_caller_identity()['Account']
              domain_id = os.environ.get('DOMAIN_ID', '')
              project_id = os.environ.get('PROJECT_ID', '')

              models = {
                  'haiku': 'us.anthropic.claude-3-5-haiku-20241022-v1:0',
                  'sonnet': 'us.anthropic.claude-3-5-sonnet-20241022-v2:0',
                  'sonnet4': 'us.anthropic.claude-sonnet-4-20250514-v1:0',
                  'sonnet45': 'us.anthropic.claude-sonnet-4-5-20250929-v1:0',
              }

              created_arns = []

              for model_key, model_id in models.items():
                  # Use DataZone-style naming
                  if domain_id and project_id:
                      profile_name = f"{domain_id} {project_id} {model_key}"
                  else:
                      profile_name = f"langgraph-lab-{model_key}"

                  model_arn = f"arn:aws:bedrock:{region}:{account_id}:inference-profile/{model_id}"

                  # Check if exists
                  try:
                      existing = bedrock.list_inference_profiles(typeEquals='APPLICATION')
                      exists = any(p['inferenceProfileName'] == profile_name
                                   for p in existing.get('inferenceProfileSummaries', []))
                      if exists:
                          print(f"Profile already exists: {profile_name}")
                          continue
                  except Exception as e:
                      print(f"Error checking profiles: {e}")

                  # Build tags
                  tags = [
                      {'key': 'Purpose', 'value': 'BedrockAgentsLab'},
                      {'key': 'Model', 'value': model_key},
                      {'key': 'AmazonBedrockManaged', 'value': 'true'},
                  ]

                  if domain_id and project_id:
                      tags.extend([
                          {'key': 'AmazonDataZoneDomain', 'value': domain_id},
                          {'key': 'AmazonDataZoneProject', 'value': project_id},
                      ])

                  try:
                      response = bedrock.create_inference_profile(
                          inferenceProfileName=profile_name,
                          modelSource={'copyFrom': model_arn},
                          description=f'Lab profile for {model_key}',
                          tags=tags
                      )
                      arn = response['inferenceProfileArn']
                      created_arns.append(arn)
                      print(f"Created: {profile_name} -> {arn}")
                  except Exception as e:
                      print(f"Failed to create {model_key}: {e}")

              return created_arns

          def delete_profiles():
              bedrock = boto3.client('bedrock')

              profiles = bedrock.list_inference_profiles(typeEquals='APPLICATION')
              for profile in profiles.get('inferenceProfileSummaries', []):
                  name = profile['inferenceProfileName']
                  if 'langgraph-lab' in name or 'haiku' in name or 'sonnet' in name:
                      try:
                          bedrock.delete_inference_profile(
                              inferenceProfileIdentifier=profile['inferenceProfileArn']
                          )
                          print(f"Deleted: {name}")
                      except Exception as e:
                          print(f"Failed to delete {name}: {e}")

  # Custom resource to trigger profile creation
  InferenceProfiles:
    Type: Custom::InferenceProfiles
    Condition: ShouldCreateInferenceProfiles
    DependsOn:
      - DataZoneProject
    Properties:
      ServiceToken: !GetAtt InferenceProfileFunction.Arn

Outputs:
  DomainId:
    Description: DataZone Domain ID
    Value: !GetAtt DataZoneDomain.Id
    Export:
      Name: !Sub '${AWS::StackName}-DomainId'

  DomainName:
    Description: DataZone Domain Name
    Value: !Ref DomainName

  ProjectId:
    Description: DataZone Project ID
    Value: !GetAtt DataZoneProject.Id
    Export:
      Name: !Sub '${AWS::StackName}-ProjectId'

  ProjectName:
    Description: DataZone Project Name
    Value: !Ref ProjectName

  PortalUrl:
    Description: SageMaker Unified Studio Portal URL
    Value: !Sub 'https://${DataZoneDomain.Id}.datazone.${AWS::Region}.on.aws'

  LabRoleArn:
    Description: ARN of the BedrockLabRole for workshop attendees
    Value: !GetAtt BedrockLabRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LabRoleArn'

  LabPolicyArn:
    Description: ARN of the BedrockAgentsLabPolicy
    Value: !Ref BedrockLabPolicy
