[project]
name = "graphrag-retrievers"
version = "0.1.0"
description = "Neo4j GraphRAG Retrievers - Vector, VectorCypher, and Text2Cypher examples"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    # neo4j-graphrag with Bedrock support from GitHub
    "neo4j-graphrag[bedrock] @ git+https://github.com/neo4j-partners/neo4j-graphrag-python.git@bedrock-embeddings",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
