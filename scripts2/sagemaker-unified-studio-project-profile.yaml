AWSTemplateFormatVersion: '2010-09-09'
Description: SageMaker Unified Studio Project Profile with All Capabilities

Parameters:
  DomainId:
    Description: The ID of the SageMaker Unified Studio domain (from domain stack output)
    Type: String
    AllowedPattern: ^dzd[_-][a-zA-Z0-9_-]{1,36}$

  ProjectProfileName:
    Description: Name for the project profile
    Type: String
    Default: All Capabilities
    MaxLength: 64
    AllowedPattern: ^[\w -]+$

  ProjectProfileDescription:
    Description: Description for the project profile
    Type: String
    Default: Project profile with all SageMaker Unified Studio capabilities including data analytics, ML, and GenAI

  ProjectProfileStatus:
    Description: Status of the project profile
    Type: String
    Default: ENABLED
    AllowedValues:
      - ENABLED
      - DISABLED

Resources:
  # All Capabilities Project Profile
  AllCapabilitiesProjectProfile:
    Type: AWS::DataZone::ProjectProfile
    Properties:
      Name: !Ref ProjectProfileName
      Description: !Ref ProjectProfileDescription
      DomainIdentifier: !Ref DomainId
      Status: !Ref ProjectProfileStatus
      UseDefaultConfigurations: true

Outputs:
  ProjectProfileId:
    Description: The ID of the project profile
    Value: !GetAtt AllCapabilitiesProjectProfile.Id
    Export:
      Name: !Sub ${ProjectProfileName}-ProjectProfileId

  ProjectProfileIdentifier:
    Description: The identifier of the project profile
    Value: !GetAtt AllCapabilitiesProjectProfile.Identifier
    Export:
      Name: !Sub ${ProjectProfileName}-Identifier

  ProjectProfileDomainId:
    Description: The domain ID associated with the project profile
    Value: !GetAtt AllCapabilitiesProjectProfile.DomainId
    Export:
      Name: !Sub ${ProjectProfileName}-DomainId

  ProjectProfileCreatedAt:
    Description: Timestamp when the project profile was created
    Value: !GetAtt AllCapabilitiesProjectProfile.CreatedAt
    Export:
      Name: !Sub ${ProjectProfileName}-CreatedAt

  ProjectProfileCreatedBy:
    Description: User who created the project profile
    Value: !GetAtt AllCapabilitiesProjectProfile.CreatedBy
    Export:
      Name: !Sub ${ProjectProfileName}-CreatedBy
